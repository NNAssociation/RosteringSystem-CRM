name: Quotation workflow
on: [push, pull_request]
jobs:
  workflow:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: rostering_workflow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:test-only@localhost:5432/rostering_workflow_test
      DIRECT_URL: postgresql://postgres:test-only@localhost:5432/rostering_workflow_test
      TEST_DATABASE_URL: postgresql://postgres:test-only@localhost:5432/rostering_workflow_test
      BUSINESS_TIMEZONE: Australia/Sydney
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backendServer/package-lock.json
      - run: npm ci
        working-directory: backendServer
      - run: npx prisma db push
        working-directory: backendServer
      - run: npx tsc --noEmit
        working-directory: backendServer
      - run: npm test
        working-directory: backendServer
