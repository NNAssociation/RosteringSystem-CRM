name: Frontend CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

defaults:
  run:
    working-directory: frontend

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Install dependencies
        run: npm install

      - name: Run Linting
        run: npm run lint

      - name: Type Check (TypeScript)
        run: npx tsc --noEmit

      - name: Run Tests
        run: npm test

      - name: Production Build Check
        run: npm run build

      - name: Trigger Vercel Deploy
        # Only trigger if the push is to master AND all previous steps passed
        if: github.ref == 'refs/heads/master' && success()
        run: curl -X POST ${{ secrets.VERCEL_DEPLOY_HOOK }}
