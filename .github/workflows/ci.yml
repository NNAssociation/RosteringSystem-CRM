name: Backend CI/CD

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# This ensures all 'run' commands happen inside the backendServer folder
defaults:
  run:
    working-directory: backendServer

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # Secrets from GitHub Settings -> Secrets and variables -> Actions
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      # Fix for Supabase socket hang up: Skips downloading CLI during CI
      SUPABASE_SKIP_POSTINSTALL: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: backendServer/package-lock.json

      - name: Install dependencies
        # Using --prefer-offline helps speed up and avoid some network issues
        run: npm install --prefer-offline

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Linting (Type Check)
        run: npx tsc --noEmit

      - name: Run Prisma Validation
        run: npx prisma validate

      - name: Run Tests
        run: npm test
