name: CI Validation

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# This ensures all 'run' commands happen inside the backendServer folder
defaults:
  run:
    working-directory: backendServer

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }} # This makes it available to all steps
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          # Explicitly point to the lock file in the subfolder for caching
          cache-dependency-path: backendServer/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run Linting (Type Check)
        run: npx tsc --noEmit

      - name: Run Prisma Validation
        run: npx prisma validate

      - name: Run Tests
        run: npm test
