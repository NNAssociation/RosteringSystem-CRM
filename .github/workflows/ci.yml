name: CI Validation

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Matching your Railway logs
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run Linting
        run: npx tsc --noEmit # Checks for TypeScript errors without building

      - name: Run Prisma Validation
        run: npx prisma validate # Ensures schema.prisma is valid

      - name: Run Tests
        run: npm test
